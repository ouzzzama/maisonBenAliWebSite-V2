<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <path id="circleTextPath" d="M 110, 110 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" />
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FF4136" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .spin-badge {
      animation: spinCircle 10s linear infinite;
      transform-origin: 110px 110px;
    }
    @keyframes spinCircle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Animated Rotating Group -->
  <g class="spin-badge">
    <!-- Outer White Frame -->
    <circle cx="110" cy="110" r="105" fill="#FFFFFF" filter="url(#shadow)" />
    
    <!-- Main Orange Circle -->
    <circle cx="110" cy="110" r="98" fill="#FF4136" />
    <circle cx="110" cy="110" r="96" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

    <!-- Inner Ring Line -->
    <circle cx="110" cy="110" r="54" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />

    <!-- Curved Text Along Circle -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="3.5px" fill="#FFFFFF">
      <textPath href="#circleTextPath" startOffset="0%">
        11 ANS D'EXPÉRIENCE • MAISON BENALI •
      </textPath>
    </text>

    <!-- Center Number 11 -->
    <text x="110" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">11</text>
  </g>
</svg>
